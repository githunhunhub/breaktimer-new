name: Pages

on:
  push:
    branches:
      - master
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check static site
        run: node site/scripts/check-static.mjs site

      - name: Test download link resolver
        run: node --test site/scripts/resolve-downloads.test.mjs

      - name: Stage site
        run: |
          rm -rf _site
          cp -R site _site

      - name: Resolve download links
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node site/scripts/resolve-downloads.mjs _site

      - name: Remove build files from artifact
        run: rm -rf _site/scripts _site/README.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
