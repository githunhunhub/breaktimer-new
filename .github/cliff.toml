[changelog]
header = ""
body = """
{% if version %}\
## BreakTimer-new {{ version }}
{% else %}\
## BreakTimer-new 未发布变更
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first }} (`{{ commit.id | truncate(length=7, end="") }}`)
{%- endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "新功能" },
  { message = "^fix", group = "修复" },
  { message = "^perf", group = "性能" },
  { message = "^refactor", group = "重构" },
  { message = "^docs", group = "文档" },
  { message = "^test", group = "测试" },
  { message = "^build", group = "维护" },
  { message = "^ci", group = "维护" },
  { message = "^chore", group = "维护" },
  { message = "^merge", skip = true },
  { message = ".*", group = "其他" },
]
