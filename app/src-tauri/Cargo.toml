[package]
name = "breaktimer-new"
version = "0.1.1"
description = "Manage periodic breaks"
authors = ["BreakTimer-new contributors"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which matters on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "breaktimer_new_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
include_dir = "0.7"
thiserror = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
open = "5"
sys-locale = "0.3"
system-idle-time = "1.0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Wdk_System_SystemServices",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
