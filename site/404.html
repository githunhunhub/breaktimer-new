<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 — BreakTimer-new</title>
    <link rel="icon" href="/breaktimer-new/assets/icon-64.png" type="image/png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f4ee;
        --surface: #ffffff;
        --text: #10241f;
        --muted: #4d625c;
        --brand: #125746;
        --border: #d7e0d9;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1512;
          --surface: #12211d;
          --text: #eef7f2;
          --muted: #a9c0b7;
          --brand: #72d6b5;
          --border: #244239;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
        line-height: 1.65;
      }

      main {
        width: min(100%, 520px);
        padding: 40px 32px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
        border-radius: 18px;
      }

      p {
        margin: 0 0 8px;
        color: var(--muted);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.7rem;
        letter-spacing: -0.02em;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 26px;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text);
        font-weight: 700;
        text-decoration: none;
      }

      a.primary {
        border-color: var(--brand);
        background: var(--brand);
        color: var(--bg);
      }

      a:focus-visible {
        outline: 3px solid #b5551b;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/breaktimer-new/assets/icon-64.png" alt="" width="72" height="72" />
      <h1>页面不存在 / Page not found</h1>
      <p>这个地址没有对应页面。你可以回到宣传页或查看英文页面。</p>
      <p lang="en">This address does not exist. Return to the landing page or the English page.</p>
      <div class="actions">
        <a class="primary" href="/breaktimer-new/">返回首页</a>
        <a href="/breaktimer-new/en/" hreflang="en" lang="en">English page</a>
      </div>
    </main>
  </body>
</html>
